<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C18"/>
      <stop offset="45%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#15243A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="400" fill="url(#bgGrad)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="150" cy="80" r="180" fill="#2563EB" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1450" cy="300" r="220" fill="#06B6D4" opacity="0.10" filter="url(#glow)"/>
  <circle cx="850" cy="380" r="160" fill="#1E40AF" opacity="0.10" filter="url(#glow)"/>

  <!-- Decorative Analytics Wave & Nodes (Right Side Background) -->
  <g opacity="0.35">
    <path d="M 900 320 Q 1050 200 1200 270 T 1500 180" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 900 350 Q 1080 230 1250 310 T 1550 220" fill="none" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1050" cy="200" r="5" fill="#06B6D4"/>
    <circle cx="1200" cy="270" r="5" fill="#38BDF8"/>
    <circle cx="1350" cy="225" r="5" fill="#2563EB"/>
    <circle cx="1500" cy="180" r="6" fill="#06B6D4"/>
  </g>

  <!-- Right Decorative Analytics Card -->
  <g transform="translate(1080, 55)">
    <rect width="440" height="290" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect x="25" y="24" width="10" height="10" rx="2" fill="#06B6D4"/>
    <text x="45" y="33" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ENTERPRISE BI TELEMETRY</text>
    <rect x="365" y="22" width="50" height="18" rx="9" fill="#065F46" opacity="0.8"/>
    <text x="390" y="34" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
    
    <!-- Mini KPI Stat Row -->
    <text x="25" y="75" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">PROCESSED ROWS</text>
    <text x="25" y="105" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800">3,000,000</text>
    
    <text x="230" y="75" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">MODEL COMPRESSION</text>
    <text x="230" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">6.1 : 1</text>

    <!-- Mini Chart Grid -->
    <line x1="25" y1="130" x2="415" y2="130" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Animated-Style Column Bars -->
    <rect x="35" y="200" width="18" height="60" rx="4" fill="url(#barGrad)"/>
    <rect x="65" y="175" width="18" height="85" rx="4" fill="url(#barGrad)"/>
    <rect x="95" y="155" width="18" height="105" rx="4" fill="url(#barGrad)"/>
    <rect x="125" y="180" width="18" height="80" rx="4" fill="url(#barGrad)"/>
    <rect x="155" y="145" width="18" height="115" rx="4" fill="url(#barGrad)"/>
    <rect x="185" y="165" width="18" height="95" rx="4" fill="url(#barGrad)"/>
    <rect x="215" y="140" width="18" height="120" rx="4" fill="#06B6D4"/>
    <rect x="245" y="150" width="18" height="110" rx="4" fill="url(#barGrad)"/>
    <rect x="275" y="170" width="18" height="90" rx="4" fill="url(#barGrad)"/>
    <rect x="305" y="160" width="18" height="100" rx="4" fill="url(#barGrad)"/>
    <rect x="335" y="185" width="18" height="75" rx="4" fill="url(#barGrad)"/>
    <rect x="365" y="195" width="18" height="65" rx="4" fill="url(#barGrad)"/>
    <rect x="395" y="170" width="18" height="90" rx="4" fill="url(#barGrad)"/>

    <text x="25" y="278" fill="#64748B" font-family="system-ui, sans-serif" font-size="10.5">DAX Gating • Star Schema • OneLake Lakehouse</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(85, 0)">
    <!-- Experience Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="470" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="16" r="5" fill="#06B6D4"/>
      <text x="32" y="21" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">10+ YEARS IN MIS REPORTING &amp; ENTERPRISE BI</text>
    </g>

    <!-- Name Headline -->
    <text x="0" y="165" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-0.5">Datta Sable</text>

    <!-- Title Subtitle with Gradient -->
    <text x="0" y="215" fill="url(#accentGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="0.2">Senior MIS &amp; Business Intelligence Analyst</text>

    <!-- Pillar Badges Pill Strip -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Power BI -->
      <rect x="0" y="0" width="112" height="30" rx="6" fill="#172554" stroke="#2563EB" stroke-width="1"/>
      <text x="56" y="19" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Power BI</text>

      <!-- Pill 2: SQL Server -->
      <rect x="122" y="0" width="118" height="30" rx="6" fill="#172554" stroke="#2563EB" stroke-width="1"/>
      <text x="181" y="19" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQL Server</text>

      <!-- Pill 3: Advanced Excel -->
      <rect x="250" y="0" width="140" height="30" rx="6" fill="#172554" stroke="#2563EB" stroke-width="1"/>
      <text x="320" y="19" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Advanced Excel</text>

      <!-- Pill 4: Microsoft Fabric -->
      <rect x="400" y="0" width="145" height="30" rx="6" fill="#172554" stroke="#2563EB" stroke-width="1"/>
      <text x="472.5" y="19" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Microsoft Fabric</text>

      <!-- Pill 5: Automation -->
      <rect x="555" y="0" width="170" height="30" rx="6" fill="#083344" stroke="#06B6D4" stroke-width="1"/>
      <text x="640" y="19" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reporting Automation</text>
    </g>

    <!-- Professional Mantra Quote -->
    <g transform="translate(0, 315)">
      <line x1="0" y1="0" x2="32" y2="0" stroke="#06B6D4" stroke-width="2.5"/>
      <text x="42" y="5" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" font-style="italic">
        "Transforming Complex Business Data into Clear, Actionable Decisions."
      </text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="396" width="1600" height="4" fill="url(#accentGrad)"/>
</svg>
